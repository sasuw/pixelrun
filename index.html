<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pixel Run - Unified Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Run">
<style>
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at top, #415a77 0%, #1b263b 45%, #0d1b2a 100%);
    font-family: monospace;
}

canvas {
    display: block;
    width: min(96vw, 960px);
    height: auto;
    image-rendering: pixelated;
    border: 4px solid #ffffff;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}

#controls {
    display: none;
}

body.touch {
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

body.touch canvas {
    width: min(100vw, calc(100dvh * 16 / 9), 960px);
    border: none;
    box-shadow: none;
    touch-action: none;
}

body.touch #controls {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    box-sizing: border-box;
    width: 100%;
    padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    touch-action: none;
}

@media (orientation: landscape) {
    body.touch #controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
    }
}

.pad {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    pointer-events: auto;
}

.pad button {
    width: 64px;
    height: 64px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    background: rgba(13, 27, 42, 0.45);
    color: #ffffff;
    font: bold 13px monospace;
    touch-action: none;
}

.pad button.pressed {
    background: rgba(255, 255, 255, 0.45);
}

.pad .stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.pad .small {
    width: 52px;
    height: 52px;
    font-size: 11px;
}

#buyButton {
    display: none;
}

body.shop-open #buyButton {
    display: block;
}
</style>
</head>

<canvas id="game" width="640" height="360"></canvas>
<div id="controls">
    <div class="pad">
        <button type="button" tabindex="-1" data-key="ArrowLeft" data-hold>&#9664;</button>
        <button type="button" tabindex="-1" data-key="ArrowRight" data-hold>&#9654;</button>
    </div>
    <div class="pad">
        <div class="stack">
            <button type="button" tabindex="-1" class="small" id="buyButton" data-key="Enter">BUY</button>
            <button type="button" tabindex="-1" class="small" data-key="KeyS">SHOP</button>
        </div>
        <div class="stack">
            <button type="button" tabindex="-1" data-key="KeyF">FIRE</button>
            <button type="button" tabindex="-1" data-key="KeyX" data-hold>SLASH</button>
        </div>
        <button type="button" tabindex="-1" data-key="Space" data-hold>JUMP</button>
    </div>
</div>

<script src="game-logic.js"></script>
<script>
function createFallbackGameLogic() {
    const defaultEnemySize = { w: 16, h: 16 };
    const defaultEnemyInset = 5;
    const defaultStarterPlatform = {
        width: 128,
        height: 10,
        topY: 132,
        leftInset: 36
    };

    function createStarterPlatform(playerSpawn, options) {
        const config = {
            ...defaultStarterPlatform,
            ...(options || {})
        };

        return {
            x: Math.max(0, playerSpawn.x - config.leftInset),
            y: config.topY,
            w: config.width,
            h: config.height
        };
    }

    function rectsOverlap(a, b) {
        return a.x < b.x + b.w &&
            a.x + a.w > b.x &&
            a.y < b.y + b.h &&
            a.y + a.h > b.y;
    }

    function createSolidMask(width, height) {
        return [{ x: 0, y: 0, w: width, h: height }];
    }

    function createSpriteMask(sprite, pixelSize) {
        const size = pixelSize === undefined ? 1 : pixelSize;
        const mask = [];

        for (let row = 0; row < sprite.length; row++) {
            let segmentStart = -1;

            for (let col = 0; col <= sprite[row].length; col++) {
                const filled = col < sprite[row].length && Boolean(sprite[row][col]);

                if (filled && segmentStart === -1) {
                    segmentStart = col;
                    continue;
                }

                if (!filled && segmentStart !== -1) {
                    mask.push({
                        x: segmentStart * size,
                        y: row * size,
                        w: (col - segmentStart) * size,
                        h: size
                    });
                    segmentStart = -1;
                }
            }
        }

        return mask;
    }

    function masksOverlap(a, aMask, b, bMask) {
        for (const aSegment of aMask) {
            const aRect = {
                x: a.x + aSegment.x,
                y: a.y + aSegment.y,
                w: aSegment.w,
                h: aSegment.h
            };

            for (const bSegment of bMask) {
                if (rectsOverlap(aRect, {
                    x: b.x + bSegment.x,
                    y: b.y + bSegment.y,
                    w: bSegment.w,
                    h: bSegment.h
                })) {
                    return true;
                }
            }
        }

        return false;
    }

    function getEnemyPatrolBounds(platform, enemyWidth) {
        const minX = platform.x;
        const maxX = Math.max(platform.x, platform.x + platform.w - enemyWidth);
        return { minX, maxX };
    }

    function createEnemyForPlatform(platform, direction, options) {
        const enemySize = options && options.enemySize ? options.enemySize : defaultEnemySize;
        const inset = options && options.inset !== undefined ? options.inset : defaultEnemyInset;
        const bounds = getEnemyPatrolBounds(platform, enemySize.w);
        const clampedStartX = Math.min(bounds.maxX, Math.max(bounds.minX, platform.x + inset));

        return {
            x: clampedStartX,
            y: platform.y - enemySize.h,
            w: enemySize.w,
            h: enemySize.h,
            dir: direction,
            patrolMinX: bounds.minX,
            patrolMaxX: bounds.maxX,
            groundY: platform.y - enemySize.h
        };
    }

    function updateEnemyPatrol(enemy, turnRoll) {
        const nextEnemy = { ...enemy };

        nextEnemy.x += nextEnemy.dir;
        if (nextEnemy.x <= nextEnemy.patrolMinX) {
            nextEnemy.x = nextEnemy.patrolMinX;
            nextEnemy.dir = 1;
        } else if (nextEnemy.x >= nextEnemy.patrolMaxX) {
            nextEnemy.x = nextEnemy.patrolMaxX;
            nextEnemy.dir = -1;
        } else if (turnRoll < 0.01) {
            nextEnemy.dir *= -1;
        }

        if (nextEnemy.groundY !== undefined) {
            nextEnemy.y = nextEnemy.groundY;
        }

        return nextEnemy;
    }

    return {
        createStarterPlatform,
        createEnemyForPlatform,
        createSolidMask,
        createSpriteMask,
        masksOverlap,
        rectsOverlap,
        updateEnemyPatrol
    };
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const activeGameLogic = globalThis.GameLogic || createFallbackGameLogic();
const {
    createEnemyForPlatform,
    createSolidMask,
    createSpriteMask,
    createStarterPlatform,
    masksOverlap,
    rectsOverlap,
    updateEnemyPatrol
} = activeGameLogic;

const gravity = 0.7;
const friction = 0.88;
const rockBlockSize = 8;
const swordDrawSpeed = 0.18;
const attackDurationFrames = 8;
const fireballCooldownFrames = 18;
const platformLeadDistance = 900;
const playerSpawn = { x: 50, y: 50, w: 10, h: 10 };
const shopCost = 20;
const doubleJumpCost = 10;
const highScoreStorageKey = "pixelrun.highScore";

const jumpSound = new Audio("https://www.myinstants.com/media/sounds/maro-jump-sound-effect_1.mp3");
const coinSound = new Audio("https://www.myinstants.com/media/sounds/mario_coin_sound.mp3");
const bgMusic = new Audio("https://cdn.pixabay.com/audio/2024/08/20/audio_3204534a60.mp3");
bgMusic.loop = true;
// Alle Sounds und die Musik sind um 25 % leiser.
jumpSound.volume = 0.15;
coinSound.volume = 0.25;
bgMusic.volume = 0.125;

function pauseAllAudio() {
    bgMusic.pause();
    jumpSound.pause();
    coinSound.pause();
}

function resumeAudio() {
    if (document.visibilityState === "visible" &&
        document.hasFocus() &&
        gameState === "playing" &&
        !isPaused) {
        bgMusic.play().catch(() => {});
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
        pauseAllAudio();
        clearKeys();
    } else {
        resumeAudio();
    }
});

window.addEventListener("blur", () => {
    pauseAllAudio();
    clearKeys();
});

window.addEventListener("focus", resumeAudio);
const ninjaSkin = {
    idle: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#00c853", "#00c853", "#000"],
        ["#000", "#000", "", "#000"]
    ],
    run1: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#00c853", "#00c853", "#000"],
        ["#000", "", "#000", "#000"]
    ],
    run2: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#00c853", "#00c853", "#000"],
        ["", "#000", "#000", "#000"]
    ],
    jump: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#00c853", "#00c853", "#000"],
        ["#000", "#000", "", "#000"]
    ],
    attack: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#00c853", "#00c853", "#000"],
        ["#000", "#000", "", "#000"]
    ]
};

const playerCollisionMasks = Object.fromEntries(
    Object.entries(ninjaSkin).map(([frameName, skin]) => [frameName, createSpriteMask(skin, 3)])
);
const coinCollisionMask = createSolidMask(6, 6);
const enemyCollisionMask = createSolidMask(16, 16);

const keys = {};
const clouds = [
    { x: 50, y: 50 },
    { x: 200, y: 90 },
    { x: 400, y: 60 },
    { x: 620, y: 35 }
];

const tickMs = 1000 / 30;
const maxFrameMs = 250;
const touchQuery = window.matchMedia ? window.matchMedia("(any-pointer: coarse)") : null;

let gameState = "menu";
let isPaused = false;
let player = null;
let cameraX = 0;
let score = 0;
let highScore = loadHighScore();
let coinsBank = 0;
let platforms = [];
let coins = [];
let randomEvents = [];
let eventMessage = "";
let eventMessageFrames = 0;
let winterMode = false;
let enemies = [];
let fireBalls = [];
let rockWall = [];
let lastPlatformX = 0;
let lastFrameTime = null;
let tickAccumulator = 0;
let touchMode = Boolean(touchQuery && touchQuery.matches);
let audioUnlocked = false;
let ninjaFrameCounter = 0;
let shopOpen = false;
let hasFireSword = false;
let hasDoubleJump = false;
let drawingSword = false;
let swordProgress = 0;
let attacking = false;
let attackFramesLeft = 0;
let fireballCooldown = 0;

function clearKeys() {
    for (const code of Object.keys(keys)) {
        keys[code] = false;
    }
}

// localStorage can be unavailable (private mode, blocked site data), so the
// game must keep working without it.
function loadHighScore() {
    try {
        const stored = Number(localStorage.getItem(highScoreStorageKey));
        return Number.isFinite(stored) && stored > 0 ? Math.floor(stored) : 0;
    } catch {
        return 0;
    }
}

function updateHighScore() {
    if (score <= highScore) {
        return;
    }
    highScore = score;
    try {
        localStorage.setItem(highScoreStorageKey, String(highScore));
    } catch {
        // Keep the in-memory high score only.
    }
}

function safePlay(audio) {
    if (document.visibilityState !== "visible" ||
        !document.hasFocus()) {
        return;
    }

    audio.currentTime = 0;
    audio.play().catch(() => {});
}

function resetCombatState() {
    drawingSword = false;
    swordProgress = 0;
    attacking = false;
    attackFramesLeft = 0;
    fireballCooldown = 0;
}

function resetRun() {
    score = 0;
    cameraX = 0;
    ninjaFrameCounter = 0;
    platforms = [];
    coins = [];
    randomEvents = [];
    eventMessage = "";
    eventMessageFrames = 0;
    winterMode = false;
    enemies = [];
    fireBalls = [];
    rockWall = [];
    lastPlatformX = 0;
    shopOpen = false;
    player = {
        x: playerSpawn.x,
        y: playerSpawn.y,
        w: playerSpawn.w,
        h: playerSpawn.h,
        dx: 0,
        dy: 0,
        jumps: 0,
        facing: 1
    };

    clearKeys();
    resetCombatState();

    const startIndex = Math.floor((player.x - 150) / rockBlockSize);
    const columnsNeeded = Math.ceil(canvas.width / rockBlockSize) + 50;
    for (let i = startIndex; i < startIndex + columnsNeeded; i++) {
        generateRockColumn(i);
    }
    generateWorld();
}

function startGame() {
    resetRun();
    gameState = "playing";
    isPaused = false;
    bgMusic.play().catch(() => {});
}

function endRun() {
    updateHighScore();
    gameState = "menu";
    isPaused = false;
    pauseAllAudio();
    shopOpen = false;
    clearKeys();
    resetCombatState();
}

function generateRockColumn(xIndex) {
    const col = [];
    const rockRows = Math.ceil(canvas.height / rockBlockSize);
    const shades = ["#6a6a6a", "#7a7a7a", "#8a8a8a", "#9a9a9a"];
    for (let y = 0; y < rockRows; y++) {
        col.push(shades[Math.floor(Math.random() * shades.length)]);
    }
    rockWall.push({ xIndex, col });
}

function updateRockWall() {
    rockWall = rockWall.filter((column) => (column.xIndex * rockBlockSize) > cameraX - 100);
    let lastXIndex = rockWall.length === 0
        ? Math.floor(cameraX / rockBlockSize)
        : rockWall[rockWall.length - 1].xIndex;

    while (lastXIndex * rockBlockSize < cameraX + canvas.width + 100) {
        lastXIndex++;
        generateRockColumn(lastXIndex);
    }
}

function generateWorld() {
    if (platforms.length === 0) {
        const starterPlatform = createStarterPlatform(playerSpawn);
        platforms.push(starterPlatform);
        lastPlatformX = starterPlatform.x + starterPlatform.w;
    }

    while (lastPlatformX < cameraX + platformLeadDistance) {
        // Der Schwierigkeitsgrad steigt mit der zurückgelegten Strecke und bleibt begrenzt.
        const difficulty = Math.min(cameraX / 12000, 1);
        const width = (48 - difficulty * 18) + Math.random() * 48;
        const gap = 28 + Math.random() * (44 + difficulty * 38);
        const height = 140 + Math.random() * (110 + difficulty * 25);
        const platform = { x: lastPlatformX + gap, y: height, w: width, h: 10 };

        platforms.push(platform);

        // Mit der Zeit erscheinen etwas weniger Münzen und mehr Gegner.
        if (Math.random() < 0.68 - difficulty * 0.18) {
            coins.push({ x: platform.x + width / 2 - 3, y: platform.y - 12, w: 6, h: 6 });
        }
        if (Math.random() < 0.18 + difficulty * 0.27) {
            enemies.push(createEnemyForPlatform(
                platform,
                Math.random() < 0.5 ? -1 : 1,
                { enemySize: { w: 16, h: 16 } }
            ));
        }

        // Seltene Fragezeichen erscheinen direkt auf einer Plattform.
        if (Math.random() < 0.075) {
            randomEvents.push({
                x: platform.x + width / 2 - 9,
                y: platform.y - 28,
                w: 18,
                h: 22,
                platform
            });
        }

        lastPlatformX += gap + width;
    }
}

function getNinjaFrame() {
    if (!player) {
        return "idle";
    }
    if (drawingSword || attacking) {
        return "attack";
    }
    if (player.jumps > 0) {
        return "jump";
    }
    if (keys.ArrowLeft || keys.ArrowRight) {
        return ninjaFrameCounter % 6 < 3 ? "run1" : "run2";
    }
    return "idle";
}

function getKatanaHitbox() {
    return {
        x: player.x + (player.facing === 1 ? player.w : -8),
        y: player.y + 1,
        w: 8,
        h: 12
    };
}

function playerOverlapsEntity(entity, entityMask) {
    return masksOverlap(player, playerCollisionMasks[getNinjaFrame()], entity, entityMask);
}

function buyFireSword() {
    if (hasFireSword || coinsBank < shopCost) {
        return;
    }
    coinsBank -= shopCost;
    hasFireSword = true;
}

function buyShopUpgrade() {
    if (!hasDoubleJump && coinsBank >= doubleJumpCost) {
        coinsBank -= doubleJumpCost;
        hasDoubleJump = true;
        return;
    }
    buyFireSword();
}

function launchFireball() {
    if (!hasFireSword || fireballCooldown > 0 || !player) {
        return;
    }

    fireBalls.push({
        x: player.x + (player.facing === 1 ? player.w : -6),
        y: player.y + 3,
        w: 6,
        h: 6,
        dir: player.facing,
        speed: 6
    });
    fireballCooldown = fireballCooldownFrames;
}

function startAttack() {
    if (!player || shopOpen || drawingSword || attacking) {
        return;
    }
    drawingSword = true;
    swordProgress = 0;
}

function updateAttackState() {
    if (drawingSword) {
        swordProgress = Math.min(1, swordProgress + swordDrawSpeed);
        if (swordProgress >= 1) {
            drawingSword = false;
            attacking = true;
            attackFramesLeft = attackDurationFrames;
        }
    } else if (attacking) {
        attackFramesLeft--;
        if (attackFramesLeft <= 0) {
            attacking = false;
        }
    }
}

function updatePlayer() {
    if (keys.ArrowLeft || keys.ArrowRight) {
        ninjaFrameCounter++;
    }
    if (keys.ArrowLeft) {
        player.dx -= 0.5;
        player.facing = -1;
    }
    if (keys.ArrowRight) {
        player.dx += 0.5;
        player.facing = 1;
    }
    const maxJumps = hasDoubleJump ? 2 : 1;
    if (keys.Space && player.jumps < maxJumps) {
        player.dy = -12;
        player.jumps++;
        safePlay(jumpSound);
        keys.Space = false;
    }
    if (keys.KeyX || keys.ShiftLeft || keys.ShiftRight) {
        startAttack();
    }

    const previousBottom = player.y + player.h;
    // Sprünge werden auf längeren Runs etwas anspruchsvoller.
    const difficulty = Math.min(cameraX / 16000, 1);
    player.dy += gravity + difficulty * 0.18;
    player.x += player.dx;
    player.y += player.dy;
    player.dx *= friction;

    if (player.x < 0) {
        player.x = 0;
        player.dx = 0;
    }

    for (const platform of platforms) {
        const fallingOntoPlatform =
            player.x < platform.x + platform.w &&
            player.x + player.w > platform.x &&
            previousBottom <= platform.y &&
            player.y + player.h >= platform.y;

        if (fallingOntoPlatform) {
            player.y = platform.y - player.h;
            player.dy = 0;
            player.jumps = 0;
        }
    }
}

function updateCoins() {
    coins = coins.filter((coin) => {
        if (!playerOverlapsEntity(coin, coinCollisionMask)) {
            return true;
        }
        score++;
        coinsBank++;
        updateHighScore();
        safePlay(coinSound);
        return false;
    });
}

function triggerRandomEvent(index) {
    const randomEvent = randomEvents[index];
    if (!randomEvent) return;

    const outcomes = [
        () => {
            const reward = 5 + Math.floor(Math.random() * 11);
            coinsBank += reward;
            return `Glueck! +${reward} Münzen`;
        },
        () => {
            const reward = 20 + Math.floor(Math.random() * 31);
            score += reward;
            updateHighScore();
            return `Bonus! +${reward} Punkte`;
        },
        () => {
            const defeated = enemies.length;
            enemies = [];
            return defeated ? `Jungle-Power! ${defeated} Gegner besiegt` : "Jungle-Power! Freie Bahn";
        }
    ];

    if (!hasDoubleJump) {
        outcomes.push(() => {
            hasDoubleJump = true;
            return "Ninja-Kraft! Doppelsprung freigeschaltet";
        });
    }
    outcomes.push(() => {
        winterMode = true;
        return "Winterzauber! Die Landschaft ist jetzt verschneit";
    });
    outcomes.push(() => {
        const eventPlatform = randomEvent.platform;
        if (!eventPlatform || !platforms.includes(eventPlatform)) return "Die Plattform ist schon verschwunden!";
        platforms = platforms.filter((platform) => platform !== eventPlatform);
        return "Achtung! Die Plattform verschwindet";
    });

    eventMessage = outcomes[Math.floor(Math.random() * outcomes.length)]();
    eventMessageFrames = 100;
    randomEvents.splice(index, 1);
}

function updateRandomEvents() {
    for (let i = randomEvents.length - 1; i >= 0; i--) {
        if (rectsOverlap(player, randomEvents[i])) {
            triggerRandomEvent(i);
        }
    }
}

function updateEnemies() {
    const katanaHitbox = attacking ? getKatanaHitbox() : null;

    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = updateEnemyPatrol(enemies[i], Math.random());
        enemies[i] = enemy;

        if (katanaHitbox && rectsOverlap(katanaHitbox, enemy)) {
            enemies.splice(i, 1);
            score += 5;
            updateHighScore();
            continue;
        }

        if (playerOverlapsEntity(enemy, enemyCollisionMask)) {
            endRun();
            return;
        }
    }
}

function updateFireballs() {
    for (let i = fireBalls.length - 1; i >= 0; i--) {
        const fireball = fireBalls[i];
        fireball.x += fireball.dir * fireball.speed;

        let consumed = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (!rectsOverlap(fireball, enemy)) {
                continue;
            }
            enemies.splice(j, 1);
            fireBalls.splice(i, 1);
            score += 5;
            updateHighScore();
            consumed = true;
            break;
        }

        if (!consumed && Math.abs(fireball.x - player.x) > 700) {
            fireBalls.splice(i, 1);
        }
    }
}

function drawEnemy(x, y) {
    // Größeres Fels-Schleim-Monster; die Pixelgrafik wird gleichmäßig skaliert.
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.6, 1.6);
    ctx.imageSmoothingEnabled = false;
    x = 0;
    y = 0;

    if (winterMode) {
        // Rentier mit Geweih, heller Schnauze und roter Nase.
        ctx.fillStyle = "#76502f";
        ctx.fillRect(x + 1, y + 4, 8, 4);
        ctx.fillRect(x + 2, y + 2, 6, 5);
        ctx.fillStyle = "#9b6b3d";
        ctx.fillRect(x + 3, y + 3, 4, 3);
        ctx.fillStyle = "#f4dfbd";
        ctx.fillRect(x + 5, y + 5, 4, 3);
        ctx.fillStyle = "#fff4df";
        ctx.fillRect(x + 7, y + 5, 2, 2);
        ctx.fillStyle = "#d92738";
        ctx.fillRect(x + 9, y + 6, 2, 2);
        ctx.fillStyle = "#231a14";
        ctx.fillRect(x + 6, y + 4, 1, 1);
        ctx.fillStyle = "#5a3925";
        ctx.fillRect(x + 2, y + 1, 1, 3);
        ctx.fillRect(x + 1, y, 3, 1);
        ctx.fillRect(x + 3, y + 1, 2, 1);
        ctx.fillRect(x + 7, y + 1, 1, 3);
        ctx.fillRect(x + 7, y, 3, 1);
        ctx.fillRect(x + 6, y + 1, 2, 1);
        ctx.restore();
        return;
    }

    // Kleine Stacheln und Schatten
    ctx.fillStyle = "#202033";
    ctx.fillRect(x + 1, y + 2, 2, 2);
    ctx.fillRect(x + 7, y + 1, 2, 3);
    ctx.fillRect(x + 2, y, 2, 2);
    ctx.fillRect(x + 6, y + 7, 3, 2);

    // Körper mit steinigen violett-braunen Pixeln
    ctx.fillStyle = "#302b46";
    ctx.fillRect(x + 1, y + 3, 8, 5);
    ctx.fillStyle = "#51445f";
    ctx.fillRect(x + 2, y + 2, 6, 5);
    ctx.fillStyle = "#756078";
    ctx.fillRect(x + 3, y + 3, 2, 2);
    ctx.fillStyle = "#3c354f";
    ctx.fillRect(x + 1, y + 6, 7, 2);
    // Unterkante schließen, damit die Gegner-Textur bis ganz nach unten reicht.
    ctx.fillStyle = "#202033";
    ctx.fillRect(x + 1, y + 8, 7, 1);
    ctx.fillStyle = "#51445f";
    ctx.fillRect(x + 2, y + 8, 5, 1);
    ctx.fillStyle = "#8d6c78";
    ctx.fillRect(x + 6, y + 5, 2, 1);

    // Leuchtende moosgrüne Details, damit es zur Plattform passt
    ctx.fillStyle = "#70df43";
    ctx.fillRect(x + 2, y + 2, 2, 1);
    ctx.fillRect(x + 7, y + 4, 1, 1);

    // Augen und kleiner Mund
    ctx.fillStyle = "#ffefb0";
    ctx.fillRect(x + 2, y + 4, 2, 2);
    ctx.fillRect(x + 6, y + 4, 2, 2);
    ctx.fillStyle = "#f04445";
    ctx.fillRect(x + 3, y + 4, 1, 2);
    ctx.fillRect(x + 6, y + 4, 1, 2);
    ctx.fillStyle = "#171523";
    ctx.fillRect(x + 4, y + 7, 2, 1);
    ctx.restore();
}

function drawRandomEvents() {
    for (const randomEvent of randomEvents) {
        const x = Math.round(randomEvent.x - cameraX);
        const y = Math.round(randomEvent.y);
        ctx.save();
        ctx.fillStyle = "#ffd54a";
        ctx.strokeStyle = "#3b2600";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x, y, randomEvent.w, randomEvent.h, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#3b2600";
        ctx.font = "bold 17px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", x + randomEvent.w / 2, y + randomEvent.h / 2 + 1);
        ctx.restore();
    }
    if (eventMessageFrames > 0) {
        ctx.save();
        ctx.fillStyle = "rgba(13, 27, 42, 0.88)";
        ctx.fillRect(150, 44, 340, 30);
        ctx.strokeStyle = "#ffd54a";
        ctx.strokeRect(150, 44, 340, 30);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(eventMessage, canvas.width / 2, 59);
        ctx.restore();
    }
}

function drawKatana(x, y) {
    const katanaLength = 12;
    const katanaWidth = 2;
    const spriteCenterX = x + 6;
    const handX = 0;
    const handY = 2;

    // Draw in right-facing coordinates around the sprite center and mirror
    // for the left, so the sword looks the same in both directions.
    ctx.save();
    ctx.translate(spriteCenterX, y);
    ctx.scale(player.facing, 1);

    if (drawingSword) {
        const backX = -4;
        const backY = 0;
        const drawX = backX + (handX - backX) * swordProgress;
        const drawY = backY + (handY - backY) * swordProgress;

        ctx.translate(drawX, drawY);
        ctx.fillStyle = "#cccccc";
        ctx.fillRect(0, 0, katanaWidth, katanaLength);
    } else if (attacking) {
        const swingProgress = 1 - (attackFramesLeft / attackDurationFrames);
        const angle = swingProgress * 0.8 - 0.4;

        ctx.translate(handX, handY);
        ctx.rotate(angle);
        ctx.fillStyle = "#ffff66";
        ctx.fillRect(0, 0, katanaWidth, katanaLength);
    } else {
        ctx.translate(handX, handY);
        ctx.fillStyle = "#cccccc";
        ctx.fillRect(0, 0, katanaWidth, 4);
    }

    ctx.restore();
}

function drawPlayer(x, y) {
    const frameName = getNinjaFrame();
    const skin = ninjaSkin[frameName];
    const pixelSize = 3;

    for (let row = 0; row < skin.length; row++) {
        for (let col = 0; col < skin[row].length; col++) {
            if (!skin[row][col]) {
                continue;
            }
            ctx.fillStyle = skin[row][col];
            ctx.fillRect(x + col * pixelSize, y + row * pixelSize, pixelSize, pixelSize);
        }
    }

    if (winterMode) {
        // Rote Zipfelmütze mit weißem Rand und Bommel.
        ctx.fillStyle = "#d71935";
        ctx.fillRect(x + 3, y - 2, 8, 3);
        ctx.fillRect(x + 7, y - 4, 5, 3);
        ctx.fillRect(x + 10, y - 6, 3, 3);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 3, y, 9, 2);
        ctx.fillRect(x + 11, y - 7, 3, 3);
    }

    drawKatana(x, y);
}

function drawJungleBackground() {
    if (winterMode) {
        const winterSky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        winterSky.addColorStop(0, "#8ec9e8");
        winterSky.addColorStop(0.62, "#d9f2ff");
        winterSky.addColorStop(1, "#a8d5e8");
        ctx.fillStyle = winterSky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f7fdff";
        ctx.beginPath();
        ctx.moveTo(0, 190);
        ctx.lineTo(110, 82);
        ctx.lineTo(220, 190);
        ctx.lineTo(330, 65);
        ctx.lineTo(490, 190);
        ctx.lineTo(580, 100);
        ctx.lineTo(640, 165);
        ctx.lineTo(640, 360);
        ctx.lineTo(0, 360);
        ctx.fill();
        ctx.fillStyle = "#e8f8ff";
        ctx.fillRect(0, canvas.height - 44, canvas.width, 44);
        for (let i = 0; i < 36; i++) {
            const x = (i * 97 + Math.sin(Date.now() / 700 + i) * 12) % canvas.width;
            const y = (i * 53 + Date.now() / 35) % canvas.height;
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.fillRect(x, y, 3, 3);
        }
        return;
    }

    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, "#183f32");
    gradient.addColorStop(0.58, "#286347");
    gradient.addColorStop(1, "#102d28");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Helle Lichtlücken im Blätterdach und feuchter Dunst geben dem Wald Tiefe.
    const light = ctx.createRadialGradient(canvas.width * 0.68, 92, 8, canvas.width * 0.68, 92, 230);
    light.addColorStop(0, "rgba(190, 220, 111, 0.19)");
    light.addColorStop(1, "rgba(190, 220, 111, 0)");
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.72);
    ctx.fillStyle = "rgba(127, 174, 91, 0.08)";
    ctx.fillRect(0, canvas.height * 0.48, canvas.width, 34);

    // Ferne, dichte Baumreihen geben dem Level Tiefe.
    for (let layer = 0; layer < 3; layer++) {
        const spacing = 58 + layer * 19;
        const drift = (cameraX * (0.12 + layer * 0.08)) % spacing;
        for (let x = -spacing - drift; x < canvas.width + spacing; x += spacing) {
            const treeX = Math.round(x);
            const top = 18 + ((Math.floor((x + drift) / spacing) * 17 + layer * 23) % 34);
            ctx.fillStyle = ["#164333", "#1b503b", "#236044"][layer];
            ctx.fillRect(treeX + spacing * 0.38, top + 24, 9, canvas.height - top - 24);
            ctx.fillRect(treeX + spacing * 0.12, top + 13, spacing * 0.76, 18);
            ctx.fillRect(treeX + spacing * 0.24, top + 3, spacing * 0.54, 17);
            ctx.fillRect(treeX + spacing * 0.34, top - 5, spacing * 0.34, 12);
        }
    }

    // Farnartige Büsche und breite Blätter zwischen den Baumstämmen.
    const bushSpacing = 47;
    const bushDrift = (cameraX * 0.22) % bushSpacing;
    for (let x = -bushSpacing - bushDrift; x < canvas.width + bushSpacing; x += bushSpacing) {
        const baseY = canvas.height - 61 + (Math.floor((x + bushDrift) / bushSpacing) % 3) * 5;
        const bushX = Math.round(x);
        ctx.fillStyle = "#174c35";
        ctx.fillRect(bushX + 3, baseY + 11, 34, 14);
        ctx.fillStyle = "#287044";
        ctx.fillRect(bushX + 7, baseY + 5, 8, 13);
        ctx.fillRect(bushX + 17, baseY, 8, 18);
        ctx.fillRect(bushX + 27, baseY + 7, 8, 11);
        ctx.fillStyle = "#6b9d43";
        ctx.fillRect(bushX + 9, baseY + 7, 3, 7);
        ctx.fillRect(bushX + 20, baseY + 3, 3, 8);
    }

    // Blätterdach am oberen Rand.
    ctx.fillStyle = "#102e25";
    ctx.fillRect(0, 0, canvas.width, 13);
    for (let x = -12; x < canvas.width + 20; x += 24) {
        const sway = Math.sin(Date.now() / 900 + x) * 2;
        ctx.fillStyle = x % 48 === 0 ? "#1c563b" : "#245f3e";
        ctx.fillRect(x + sway, 5, 18, 10);
        ctx.fillRect(x + 4 + sway, 0, 12, 9);
    }

    // Lianen hängen in gleichmäßigen Abständen vom Blätterdach.
    const vineSpacing = 112;
    const vineDrift = (cameraX * 0.32) % vineSpacing;
    for (let x = -vineSpacing - vineDrift; x < canvas.width + vineSpacing; x += vineSpacing) {
        const vineX = Math.round(x);
        const seed = Math.floor((x + vineDrift) / vineSpacing);
        const length = 74 + Math.abs((seed * 37) % 145);
        const bend = (seed % 2 ? 1 : -1) * (11 + Math.abs((seed * 13) % 17));
        ctx.strokeStyle = "#597c2b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(vineX, 8);
        ctx.quadraticCurveTo(vineX + bend, length * 0.52, vineX + bend * 0.35, length);
        ctx.stroke();
        for (let leafY = 28; leafY < length - 4; leafY += 25) {
            const leafX = vineX + bend * (leafY / length) * 0.8;
            const side = (Math.floor(leafY / 25) + seed) % 2 ? 1 : -1;
            ctx.fillStyle = leafY % 2 ? "#79a83b" : "#4f8b36";
            ctx.fillRect(leafX + (side < 0 ? -12 : 3), leafY, 9, 4);
            ctx.fillRect(leafX + (side < 0 ? -13 : 8), leafY - 2, 5, 4);
        }
    }

    // Kleine Glühwürmchen sorgen für Bewegung in den dunklen Bereichen.
    for (let i = 0; i < 9; i++) {
        const fireflyX = (i * 83 + Math.sin(Date.now() / 900 + i * 2) * 15 + canvas.width) % canvas.width;
        const fireflyY = 92 + (i * 47) % (canvas.height - 150) + Math.sin(Date.now() / 700 + i) * 5;
        const glow = 0.35 + (Math.sin(Date.now() / 260 + i * 3) + 1) * 0.25;
        ctx.fillStyle = `rgba(220, 242, 125, ${glow})`;
        ctx.fillRect(Math.round(fireflyX), Math.round(fireflyY), 3, 3);
        ctx.fillStyle = `rgba(220, 242, 125, ${glow * 0.16})`;
        ctx.fillRect(Math.round(fireflyX - 2), Math.round(fireflyY - 2), 7, 7);
    }

    // Große Blätter rahmen die Szene am unteren Rand ein.
    ctx.fillStyle = "#123b2b";
    for (let i = 0; i < 7; i++) {
        const leafX = i * 105 - 18;
        const leafY = canvas.height - 27 + Math.sin(Date.now() / 800 + i) * 2;
        ctx.save();
        ctx.translate(leafX, leafY);
        ctx.rotate((i % 2 ? -1 : 1) * 0.22);
        ctx.fillRect(0, 0, 45, 8);
        ctx.fillRect(8, -5, 29, 6);
        ctx.restore();
    }

    // Dunkler Sumpf am unteren Bildrand statt des bisherigen blauen Wassers.
    const swamp = ctx.createLinearGradient(0, canvas.height - 44, 0, canvas.height);
    swamp.addColorStop(0, "rgba(21, 75, 53, 0.35)");
    swamp.addColorStop(1, "rgba(8, 38, 34, 0.92)");
    ctx.fillStyle = swamp;
    ctx.fillRect(0, canvas.height - 44, canvas.width, 44);
    const rippleOffset = (Date.now() * 0.004) % 32;
    ctx.fillStyle = "rgba(113, 159, 79, 0.35)";
    for (let x = -32 - rippleOffset; x < canvas.width; x += 32) {
        ctx.fillRect(x, canvas.height - 14 + Math.sin((x + rippleOffset) / 13) * 2, 17, 2);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawJungleBackground();

    for (const column of rockWall) {
        for (let y = 0; y < column.col.length; y++) {
            ctx.fillStyle = column.col[y];
            ctx.fillRect(column.xIndex * rockBlockSize - cameraX, y * rockBlockSize, rockBlockSize, rockBlockSize);
        }
    }

    if (gameState === "menu") {
        drawMenu();
        return;
    }

    for (const platform of platforms) {
        const screenX = Math.round(platform.x - cameraX);
        const topY = Math.round(platform.y);
        if (winterMode) {
            ctx.fillStyle = "#8bb9c9";
            ctx.fillRect(screenX, topY, platform.w, platform.h);
            ctx.fillStyle = "#f7fdff";
            ctx.fillRect(screenX, topY - 3, platform.w, 5);
            ctx.fillStyle = "#d9f2ff";
            ctx.fillRect(screenX + 4, topY - 5, Math.max(0, platform.w - 8), 2);
        } else if (platformTexture.complete && platformTexture.naturalWidth > 0) {
            // Tile the crisp pixel-art grass-and-stone texture without smoothing.
            ctx.imageSmoothingEnabled = false;
            for (let i = 0; i < platform.w; i += platformTexture.naturalWidth) {
                const drawW = Math.min(platformTexture.naturalWidth, platform.w - i);
                ctx.drawImage(platformTexture, 0, 0, drawW, platformTexture.naturalHeight,
                    screenX + i, topY - 2, drawW, 16);
            }
        } else {
            ctx.fillStyle = "#62c72d";
            ctx.fillRect(screenX, topY - 2, platform.w, 4);
            ctx.fillStyle = "#59415a";
            ctx.fillRect(screenX, topY + 2, platform.w, 10);
        }
    }

    for (const coin of coins) {
        if (coinTexture.complete && coinTexture.naturalWidth > 0) {
            ctx.drawImage(coinTexture, coin.x - cameraX - 2, coin.y - 3, 10, 11);
        } else {
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(coin.x - cameraX, coin.y, coin.w, coin.h);
            ctx.fillStyle = "#FFF3B0";
            ctx.fillRect(coin.x - cameraX + 1, coin.y + 1, 2, 2);
        }
    }

    drawRandomEvents();

    for (const enemy of enemies) {
        drawEnemy(enemy.x - cameraX, enemy.y);
    }

    for (const fireball of fireBalls) {
        ctx.fillStyle = "#ff7a00";
        ctx.fillRect(fireball.x - cameraX, fireball.y, fireball.w, fireball.h);
        ctx.fillStyle = "#ffe680";
        ctx.fillRect(fireball.x - cameraX + 1, fireball.y + 1, 2, 2);
    }

    drawPlayer(player.x - cameraX, player.y);
    drawHud();

    if (shopOpen) {
        drawShop();
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    for (let i = 0; i < canvas.height; i += 2) {
        ctx.fillRect(0, i, canvas.width, 1);
    }

    if (isPaused) {
        // Eigene Canvas-Zeichenwerte sichern, damit der Shop nach dem
        // Fortsetzen wieder linksbündig und unverändert dargestellt wird.
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 32px monospace";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.fillStyle = "#000000";
        ctx.strokeText("PAUSE", canvas.width / 2, canvas.height / 2 - 12);
        ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = "14px monospace";
        ctx.strokeText("Esc oder WEITER-Button", canvas.width / 2, canvas.height / 2 + 24);
        ctx.fillText("Esc oder WEITER-Button", canvas.width / 2, canvas.height / 2 + 24);
        ctx.restore();
    }

    // Zuletzt zeichnen, damit der Button auch während der Pause sichtbar bleibt.
    drawPauseButton();
}

function tick() {
    if (!shopOpen) {
        updateAttackState();
        updatePlayer();
        updateCoins();
        updateRandomEvents();
        updateEnemies();
        if (gameState === "playing") {
            updateFireballs();
        }
    }

    if (gameState === "playing" && player.y > canvas.height) {
        endRun();
    }

    if (gameState === "playing") {
        cameraX = Math.max(0, player.x - 150);
        platforms = platforms.filter((platform) => platform.x + platform.w > cameraX - 50);
        coins = coins.filter((coin) => coin.x + coin.w > cameraX - 50);
        randomEvents = randomEvents.filter((randomEvent) => randomEvent.x + randomEvent.w > cameraX - 50);
        enemies = enemies.filter((enemy) => enemy.x + enemy.w > cameraX - 50);
        generateWorld();
        updateRockWall();
    }

    if (fireballCooldown > 0) {
        fireballCooldown--;
    }
    if (eventMessageFrames > 0) eventMessageFrames--;
}

// Run the game logic at a fixed 30 ticks per second, independent of the
// display refresh rate (60, 90, 120 Hz ...).
function update(now) {
    if (lastFrameTime === null) {
        lastFrameTime = now;
    }
    tickAccumulator += Math.min(now - lastFrameTime, maxFrameMs);
    lastFrameTime = now;

    while (tickAccumulator >= tickMs) {
        tickAccumulator -= tickMs;
        if (gameState === "playing" && !isPaused) {
            tick();
        }
    }

    document.body.classList.toggle("shop-open", gameState === "playing" && shopOpen);
    draw();
    requestAnimationFrame(update);
}

function togglePause() {
    if (gameState !== "playing") return;
    isPaused = !isPaused;
    clearKeys();
    pauseAllAudio();
    if (!isPaused) {
        resumeAudio();
    }
}

function handleAction(code) {
    if (code === "Escape") {
        if (gameState === "playing") togglePause();
        return;
    }

    if (isPaused) return;

    if (gameState === "menu") {
        startGame();
        return;
    }

    if (code === "KeyS") {
        shopOpen = !shopOpen;
        return;
    }

    if (shopOpen && code === "Enter") {
        buyShopUpgrade();
        return;
    }

    if (code === "KeyF" && !shopOpen) {
        launchFireball();
    }
}

function setTouchMode(enabled) {
    touchMode = enabled;
    document.body.classList.toggle("touch", enabled);
}

// Mobile browsers only allow audio started by a user gesture. Touch
// pointerdown does not count, so retry on pointerup and unlock the sound
// effects once by playing them muted.
function unlockAudio() {
    if (gameState === "playing" && !isPaused && bgMusic.paused) {
        bgMusic.play().catch(() => {});
    }
    if (audioUnlocked) {
        return;
    }
    audioUnlocked = true;
    for (const audio of [jumpSound, coinSound]) {
        audio.muted = true;
        audio.play()
            .then(() => {
                audio.pause();
                audio.muted = false;
            })
            .catch(() => {
                audio.muted = false;
            });
    }
}

document.addEventListener("keydown", (event) => {
    if (event.code === "Escape") {
        event.preventDefault();
        if (!event.repeat) handleAction(event.code);
        return;
    }
    keys[event.code] = true;
    handleAction(event.code);
});

document.addEventListener("keyup", (event) => {
    keys[event.code] = false;
});


for (const button of document.querySelectorAll("#controls button")) {
    const code = button.dataset.key;
    const hold = button.hasAttribute("data-hold");

    const release = () => {
        button.classList.remove("pressed");
        if (hold) {
            keys[code] = false;
        }
    };

    button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.classList.add("pressed");
        if (hold) {
            keys[code] = true;
        }
        handleAction(code);
    });
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", release);
    button.addEventListener("lostpointercapture", release);
}

canvas.addEventListener("pointerup", (event) => {
    // CSS-skaliertes Canvas in seine internen Spielkoordinaten umrechnen.
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (canvas.width / rect.width);
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);
    const b = pauseButtonRect;

    if (gameState === "playing" && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        event.preventDefault();
        togglePause();
        return;
    }

    if (gameState === "menu") {
        event.preventDefault();
        startGame();
    }
});

document.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "touch" && !touchMode) {
        setTouchMode(true);
    }
});
document.addEventListener("pointerup", unlockAudio);
document.addEventListener("contextmenu", (event) => {
    if (touchMode) {
        event.preventDefault();
    }
});

// Offline support for the installed app. Service workers need http(s),
// so opening the file directly skips this.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
    });
}

setTouchMode(touchMode);
resetRun();
document.body.dataset.gameReady = "1";
requestAnimationFrame(update);
</script>
</body>
</html>
