<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Pixel jump-Retro Run edition</title>
<style>
body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
}
canvas {
    image-rendering: pixelated;
    border: 4px solid white;
}
</style>
</head>
<body>

<canvas id="game" width="640" height="360"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameState = "menu"; 
let player;
let cameraX;
let score;
let highScore = 0;
let highScoreCopy = 0;

let platforms = [];
let coins = [];
let enemies = [];
let lastPlatformX;
let frame = 0;

const gravity = 0.7;
const friction = 0.9;

const jumpSound = new Audio("https://www.myinstants.com/media/sounds/maro-jump-sound-effect_1.mp3");
const coinSound = new Audio("https://www.myinstants.com/media/sounds/mario_coin_sound.mp3");
const bgMusic = new Audio("https://cdn.pixabay.com/audio/2024/08/20/audio_3204534a60.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.3;

const ninjaSkin = {
    idle: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#ff0000", "#ff0000", "#000"], 
        ["#000", "#000", "", "#000"]
    ],
    run1: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#ff0000", "#ff0000", "#000"],
        ["#000", "", "#000", "#000"]
    ],
    run2: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#ff0000", "#ff0000", "#000"],
        ["", "#000", "#000", "#000"]
    ],
    jump: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#ff0000", "#ff0000", "#000"],
        ["#000", "#000", "", "#000"]
    ],
    attack: [
        ["", "#000", "#000", ""],
        ["#000", "#000", "#000", "#000"],
        ["#000", "#ff0000", "#ff0000", "#000"],
        ["#000", "#000", "", "#000"]
    ]
};

const rockBlockSize = 8;
let rockWall = [];
let clouds = [{x:50,y:50},{x:200,y:90},{x:400,y:60}];

let attacking = false;
let drawingSword = false;
let swordProgress = 0;
let katanaHitbox = {x:0, y:0, w:6, h:12};

function startGame(){
    gameState = "playing";
    score = 0;
    cameraX = 0;
    platforms = [];
    coins = [];
    enemies = [];
    lastPlatformX = 0;
    player = {x:50, y:50, w:10, h:10, dx:0, dy:0, jumps:0, facing:1};

    rockWall = [];
    let startIndex = Math.floor((player.x - 150) / rockBlockSize);
    let columnsNeeded = Math.ceil(canvas.width / rockBlockSize) + 50;
    for(let i = startIndex; i < startIndex + columnsNeeded; i++){
        generateRockColumn(i);
    }

    generateWorld();
    if(bgMusic.paused) bgMusic.play();
}

function generateRockColumn(xIndex){
    let col = [];
    let rockRows = Math.ceil(canvas.height / rockBlockSize);
    let shades = ["#6a6a6a","#7a7a7a","#8a8a8a","#9a9a9a"];
    for(let y=0;y<rockRows;y++){
        col.push(shades[Math.floor(Math.random()*shades.length)]);
    }
    rockWall.push({xIndex, col});
}

function updateRockWall(){
    rockWall = rockWall.filter(c => (c.xIndex*rockBlockSize) > cameraX - 100);
    let lastXIndex = rockWall.length === 0 ? Math.floor(cameraX / rockBlockSize) : rockWall[rockWall.length-1].xIndex;
    while(lastXIndex*rockBlockSize < cameraX + canvas.width + 100){
        lastXIndex++;
        generateRockColumn(lastXIndex);
    }
}

function generateWorld(){
    while (lastPlatformX < cameraX + 800) {
        let width = 40 + Math.random()*40;
        let gap = 30 + Math.random()*40;
        let height = 140 + Math.random()*100;

        let platform = {x:lastPlatformX+gap, y:height, w:width, h:10};
        platforms.push(platform);

        if(Math.random()<0.6) coins.push({x:platform.x + width/2, y:platform.y-10});
        if(Math.random()<0.15) enemies.push({x:platform.x+5, y:platform.y-10, w:10, h:10, dir:1});
        lastPlatformX += gap + width;
    }
}

let ninjaFrameCounter = 0;
function getNinjaFrame() {
    if(attacking || drawingSword) return "attack";
    if(player.jumps > 0) return "jump";
    if(keys["ArrowLeft"] || keys["ArrowRight"]){
        ninjaFrameCounter++;
        if(ninjaFrameCounter % 10 < 5) return "run1";
        else return "run2";
    }
    return "idle";
}

const keys = {};
document.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (gameState === "menu") startGame();
});
document.addEventListener("keyup", e => keys[e.code] = false);

function attack(){
    if(!drawingSword && !attacking){
        drawingSword = true;
        swordProgress = 0;
    }
}

function update(){
    frame++;
    if(frame % 2 !== 0){ requestAnimationFrame(update); return; }

    if(gameState !== "playing"){ draw(); requestAnimationFrame(update); return; }

    if(keys["ArrowLeft"]){ player.dx -= 0.5; player.facing = -1; }
    if(keys["ArrowRight"]){ player.dx += 0.5; player.facing = 1; }
    if(keys["Space"] && player.jumps < 2){
        player.dy = -12; player.jumps++;
        jumpSound.currentTime = 0; jumpSound.play();
        keys["Space"] = false;
    }

    // Angriff jetzt mit X oder Shift
    if(keys["KeyX"] || keys["ShiftLeft"] || keys["ShiftRight"]) attack();

    player.dy += gravity;
    player.x += player.dx;
    player.y += player.dy;
    player.dx *= friction;

    for(let p of platforms){
        if(player.x < p.x + p.w && player.x + player.w > p.x &&
           player.y + player.h <= p.y + player.dy && player.y + player.h + player.dy >= p.y){
            player.y = p.y - player.h;
            player.dy = 0;
            player.jumps = 0;
        }
    }

    coins = coins.filter(c=>{
        if(player.x < c.x+6 && player.x+player.w>c.x &&
           player.y < c.y+6 && player.y+player.h>c.y){
            score++; 
            if(score > highScore) highScore = score;
            coinSound.currentTime = 0; coinSound.play();
            return false;
        }
        return true;
    });

    for(let i=enemies.length-1;i>=0;i--){
        let e = enemies[i];
        e.x += e.dir;
        if(Math.random()<0.01) e.dir *= -1;

        if(attacking){
            katanaHitbox.x = player.x + (player.facing===1 ? player.w : -6);
            katanaHitbox.y = player.y + 2;
            katanaHitbox.w = 6;
            katanaHitbox.h = 12;

            if(katanaHitbox.x < e.x + e.w && katanaHitbox.x + katanaHitbox.w > e.x &&
               katanaHitbox.y < e.y + e.h && katanaHitbox.y + katanaHitbox.h > e.y){
                enemies.splice(i,1);
                score += 5;
                if(score > highScore) highScore = score;
                continue;
            }
        }

        if(!attacking && player.x < e.x + e.w && player.x + player.w > e.x &&
           player.y < e.y + e.h && player.y + player.h > e.y){
            gameState = "menu";
        }
    }

    if(player.y > canvas.height) gameState = "menu";

    cameraX = player.x - 150;

    platforms = platforms.filter(p => p.x + p.w > cameraX - 50);
    coins = coins.filter(c => c.x > cameraX - 50);
    enemies = enemies.filter(e => e.x + e.w > cameraX - 50);
    generateWorld();
    updateRockWall();

    draw();
    requestAnimationFrame(update);
}

function drawEnemy(x, y){
    ctx.fillStyle = "#8B0000";
    ctx.fillRect(x, y, 10, 10);
    ctx.fillStyle = "#fff";
    ctx.fillRect(x+2, y+2, 2, 2);
    ctx.fillRect(x+6, y+2, 2, 2);
    ctx.fillStyle = "#000";
    ctx.fillRect(x+3, y+7, 4, 1);
}

function drawPlayer(x, y){
    const frame = getNinjaFrame();
    const skin = ninjaSkin[frame];
    const pixelSize = 3;

    for (let row = 0; row < skin.length; row++) {
        for (let col = 0; col < skin[row].length; col++) {
            if (skin[row][col]) {
                ctx.fillStyle = skin[row][col];
                ctx.fillRect(x + col*pixelSize, y + row*pixelSize, pixelSize, pixelSize);
            }
        }
    }

    let katanaLength = 12;
    let katanaWidth = 2;
    let shoulderX = x + 6 * player.facing;
    let shoulderY = y + 2;

    ctx.save();
    if(drawingSword){
        swordProgress += 0.2;
        if(swordProgress >= 1){
            swordProgress = 1;
            drawingSword = false;
            attacking = true;
            setTimeout(()=>attacking=false,100);
        }
        let handX = x + 6 * player.facing;
        let handY = y + 2;
        let backX = x + 2 * player.facing;
        let backY = y + 0;
        let drawX = backX + (handX - backX) * swordProgress;
        let drawY = backY + (handY - backY) * swordProgress;
        let angle = 0;
        if(attacking){
            let swingProgress = (Date.now() % 100) / 100;
            angle = swingProgress * 0.4 * player.facing - 0.2 * player.facing;
            ctx.fillStyle = "#FFFF00";
        } else ctx.fillStyle = "#CCCCCC";
        ctx.translate(drawX, drawY);
        ctx.rotate(angle);
        ctx.fillRect(0,0,katanaWidth,katanaLength);
    } else if(!attacking){
        ctx.translate(shoulderX, shoulderY);
        ctx.fillStyle = "#CCCCCC";
        ctx.fillRect(0,0,katanaWidth,4);
    } else {
        let handX = x + 6 * player.facing;
        let handY = y + 2;
        ctx.translate(handX, handY);
        let swingProgress = (Date.now() % 100) / 100;
        let angle = swingProgress * 0.4 * player.facing - 0.2 * player.facing;
        ctx.rotate(angle);
        ctx.fillStyle = "#FFFF00";
        ctx.fillRect(0,0,katanaWidth,katanaLength);
    }
    ctx.restore();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Himmel
    let gradient = ctx.createLinearGradient(0,0,0,canvas.height);
    gradient.addColorStop(0,"#87CEEB");
    gradient.addColorStop(1,"#C0E0FF");
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Wasser am unteren Rand
    let waterHeight = 40;
    let waveOffset = (Date.now() * 0.005) % 20;
    for (let y = canvas.height - waterHeight; y < canvas.height; y += 4) {
        ctx.fillStyle = `rgba(0,100,255,0.6)`;
        for (let x = 0; x < canvas.width; x += 8) {
            let wave = Math.sin((x + waveOffset)/10) * 3;
            ctx.fillRect(x, y + wave, 8, 4);
        }
    }

    // Felsen
    for(let c of rockWall){
        for(let y=0;y<c.col.length;y++){
            ctx.fillStyle = c.col[y];
            ctx.fillRect(c.xIndex*rockBlockSize - cameraX, y*rockBlockSize, rockBlockSize, rockBlockSize);
        }
    }

    // Wolken
    for(let c of clouds){
        ctx.fillStyle="white";
        ctx.fillRect(c.x - cameraX*0.5, c.y,16,8);
        ctx.fillRect(c.x+8 - cameraX*0.5, c.y-4,16,8);
        ctx.fillRect(c.x+16 - cameraX*0.5, c.y,16,8);
    }

    if(gameState==="menu"){
        ctx.fillStyle="black";
        ctx.font="bold 20px monospace";
        ctx.fillText("PIXEL RUN", 220,120);
        ctx.font="12px monospace";
        ctx.fillText("Press any key", 240,160);
        ctx.fillText("Highscore: " + highScore, 240, 190);
        return;
    }

    for(let p of platforms){
        for(let i=0;i<p.w;i+=8){
            ctx.fillStyle="#8B4513";
            ctx.fillRect(p.x - cameraX + i, p.y, 8, 8);
            ctx.fillStyle="#5A2E0C";
            ctx.fillRect(p.x - cameraX + i, p.y+4, 8, 4);
        }
    }

    for(let c of coins){
        ctx.fillStyle="#FFD700";
        ctx.fillRect(c.x - cameraX, c.y, 6, 6);
        ctx.fillStyle="#FFF3B0";
        ctx.fillRect(c.x - cameraX+1, c.y+1, 2, 2);
    }

    for(let e of enemies){
        drawEnemy(e.x - cameraX, e.y);
    }

    drawPlayer(player.x - cameraX, player.y);

    ctx.fillStyle="black";
    ctx.font="12px monospace";
    ctx.fillText("Score: "+score,10,10);
    ctx.fillText("Highscore: "+highScore,10,25);

    ctx.fillStyle="rgba(0,0,0,0.15)";
    for(let i=0;i<canvas.height;i+=2){
        ctx.fillRect(0,i,canvas.width,1);
    }
}

update();
</script>
</body>
</html>
